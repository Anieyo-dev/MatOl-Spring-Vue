version: "3.9"
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: ["npm", "run", "dev"]
    env_file:
      - ../config/env/server-developer.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - type: volume
        source: node_modules
        target: /node_modules
    ports:
      - 8080:8080

volumes:
  node_modules: