version: '3.9'

services:

  postgres:
    container_name: postgresMatolDev
    image: postgres
    environment:
      POSTGRES_USER: matol
      POSTGRES_PASSWORD: password
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - postgres
    restart: unless-stopped

  pgadmin:
    container_name: pgadminMatol
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - postgres
    restart: unless-stopped

  maildev:
    container_name: mailDevMatol
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - spring

  backend:
    container_name: backendMatol
    image: matayyy/matol-backend:latest
    ports:
      - "8000:8000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - postgres
      - spring
    depends_on:
      - postgres

  frontend:
    container_name: frontedMatol
    build:
      context: ../frontend/
      dockerfile: Dockerfile
    working_dir: /app
    command: [ "npm", "run", "dev" ]
    env_file:
      - ../config/env/server-developer.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - type: bind
        source: ../frontend
        target: /app
    depends_on:
      - backend
    ports:
      - 8080:8080

networks:
  postgres:
    driver: bridge
  spring:
    driver: bridge

volumes:
  postgres:
  pgadmin:
